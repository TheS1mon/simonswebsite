---
name: Build and deploy website

# yamllint disable-line rule:truthy
on:
  push:
    branches: ["prod"]
    paths:
      - "src/**"
      - "static/**"
      - "emacs/**"
      - "template.html"
      - ".github/workflows/build-and-deploy.yaml"

permissions:
  contents: read

concurrency:
  group: deploy-prod
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Install Emacs
        run: |
          sudo apt-get update
          sudo apt-get install -y emacs-nox

      - name: Cache ELPA
        uses: actions/cache@v5
        with:
          path: .cache/elpa
          key: elpa-${{ runner.os }}-${{ hashFiles('emacs/ci-build.el') }}
          restore-keys: elpa-${{ runner.os }}-

      - name: Build
        run: emacs --batch -Q --load emacs/ci-build.el

      - name: Verify build
        run: |
          test -f site/index.html || { echo "missing index.html"; exit 1; }
          test -f site/blog/blog.html || { echo "missing blog.html"; exit 1; }
          test -f site/pgp.asc || { echo "missing pgp.asc"; exit 1; }
          test -f site/blog/posts/blog-rss.xml || { echo "missing blog-rss.xml"; exit 1; }

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: site
          path: site/
          include-hidden-files: true
          retention-days: 7

  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: build
    environment:
      name: production
      url: ${{ vars.SITE_URL }}
    steps:
      - name: Check config
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          SITE_URL: ${{ vars.SITE_URL }}
          HAS_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY != '' }}
          HAS_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS != '' }}
        run: |
          err=0
          [ -z "$DEPLOY_HOST" ] && echo "missing DEPLOY_HOST" && err=1
          [ -z "$DEPLOY_PORT" ] && echo "missing DEPLOY_PORT" && err=1
          [ -z "$DEPLOY_USER" ] && echo "missing DEPLOY_USER" && err=1
          [ -z "$DEPLOY_PATH" ] && echo "missing DEPLOY_PATH" && err=1
          [ -z "$SITE_URL" ] && echo "missing SITE_URL" && err=1
          [ "$HAS_SSH_KEY" != "true" ] && echo "missing DEPLOY_SSH_KEY" && err=1
          [ "$HAS_KNOWN_HOSTS" != "true" ] && echo "missing DEPLOY_KNOWN_HOSTS" && err=1
          exit $err

      - name: Download artifact
        uses: actions/download-artifact@v7
        with:
          name: site
          path: site

      - name: Setup SSH
        env:
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/known_hosts ~/.ssh/deploy_key

      - name: Deploy
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
        run: |
          rsync -rlpt --delete \
            --rsync-path=openrsync \
            -e "ssh -p ${DEPLOY_PORT} -i ~/.ssh/deploy_key" \
            site/ "${DEPLOY_USER}@${DEPLOY_HOST}:${DEPLOY_PATH}/"

      - name: Verify deployment
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          sleep 3
          curl -sf "$SITE_URL" > /dev/null || { echo "site unreachable"; exit 1; }
